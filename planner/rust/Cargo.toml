[package]
name = "warp-planner"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "I/O merge planners for cluster-based vector search over cloud object storage."
repository = "https://github.com/wrp-wrp/WaRP"
homepage = "https://github.com/wrp-wrp/WaRP/tree/main/planner"
documentation = "https://github.com/wrp-wrp/WaRP/blob/main/planner/README.md"
readme = "../README.md"
keywords = ["s3", "ivf", "vector-search", "io-scheduling", "object-storage"]
categories = ["algorithms", "data-structures", "filesystem"]

[lib]
name = "warp_planner"
path = "src/lib.rs"

[features]
default = []
# Opt-in object-store-backed probe loop for cost-model calibration.
probe = ["dep:tokio", "dep:object_store", "dep:futures", "dep:bytes"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

# Optional (feature = "probe"):
tokio = { version = "1", features = ["time", "rt", "macros"], optional = true }
object_store = { version = "0.11", optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
anyhow = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
rand = "0.8"
rand_distr = "0.4"
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
object_store = "0.11"

[[bench]]
name = "plan_time"
harness = false

[[bench]]
name = "plan_quality"
harness = false

[[bench]]
name = "ivf_workload"
harness = false

[[bench]]
name = "main_solution_speed"
harness = false

[[bench]]
name = "planner_smoke"
harness = false

[[example]]
name = "probe_and_plan"
required-features = ["probe"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
